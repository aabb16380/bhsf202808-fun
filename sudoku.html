<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">

<meta name="color-scheme" content="light dark">

<script src="assets/theme.js?v=20261101g70"></script>
<style>
  #app { background: #efe7d5; }

  .icon-btn {
    width: 38px;
    height: 38px;
    display: grid;
    place-items: center;
    padding: 0;
    font-family: var(--sans);
    font-size: 12px;
    color: var(--ink-2);
    background: #fff;
    border: 1px solid var(--line);
    border-radius: 999px;
    cursor: pointer;
  }

  .icon-btn:active { transform: translateY(1px); }

  .sd-wrap {
    flex: 1 1 auto;
    width: 100%;
    min-height: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 8px;
    padding: 8px 10px calc(10px + env(safe-area-inset-bottom, 0px));
    overflow-y: auto;
    overscroll-behavior: contain;
  }

  .sd-toolbar {
    width: min(94vw, 520px);
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 8px;
  }

  .sd-toolbar .chips { gap: 5px; }

  .sd-diff-chip {
    min-height: 32px;
    padding: 5px 11px;
    font-size: 12px;
  }

  .sd-new {
    flex: 0 0 auto;
    min-height: 32px;
    padding: 5px 13px;
    font-family: var(--sans);
    font-size: 12px;
    color: var(--ink-2);
    background: #fff;
    border: 1px solid var(--line);
    border-radius: 999px;
    cursor: pointer;
  }

  .sd-new:active { transform: translateY(1px); }

  /* ---------- 棋盘 ---------- */
  .sd-board {
    width: min(94vw, 48vh, 520px);
    aspect-ratio: 1 / 1;
    display: grid;
    grid-template-columns: repeat(9, minmax(0, 1fr));
    grid-template-rows: repeat(9, minmax(0, 1fr));
    background: #fff;
    border: 2px solid var(--ink);
    box-shadow: 0 10px 28px -24px rgba(35, 33, 28, 0.8);
    touch-action: manipulation;
  }

  .sd-cell {
    position: relative;
    display: grid;
    place-items: center;
    min-width: 0;
    min-height: 0;
    padding: 0;
    font-family: var(--mono);
    font-size: clamp(15px, 4.3vw, 26px);
    font-weight: 600;
    line-height: 1;
    color: var(--indigo);
    background: #fff;
    border: 1px solid var(--line);
    border-radius: 0;
    cursor: pointer;
    font-variant-numeric: tabular-nums;
    transition: background-color 0.08s linear;
  }

  .sd-cell.br { border-right: 2px solid var(--ink); }
  .sd-cell.bb { border-bottom: 2px solid var(--ink); }
  .sd-cell.is-given { color: var(--ink); background: var(--paper-2); font-weight: 700; }
  .sd-cell.is-peer { background: rgba(193, 82, 47, 0.055); }
  .sd-cell.is-same { background: rgba(47, 111, 94, 0.13); color: var(--jade); }
  .sd-cell.is-sel {
    background: rgba(193, 82, 47, 0.14);
    box-shadow: inset 0 0 0 2px var(--seal);
    z-index: 1;
  }
  .sd-cell.is-wrong {
    color: var(--seal);
    background: rgba(193, 82, 47, 0.2);
    animation: sd-shake 0.28s ease;
  }
  .sd-cell.is-hint { color: var(--jade); background: rgba(47, 111, 94, 0.18); }
  .sd-cell.is-conflict { box-shadow: inset 0 0 0 2px rgba(193, 82, 47, 0.46); }
  .sd-cell.is-sel.is-conflict { box-shadow: inset 0 0 0 2px var(--seal); }

  @keyframes sd-shake {
    0%, 100% { transform: translateX(0); }
    25% { transform: translateX(-2px); }
    75% { transform: translateX(2px); }
  }

  .sd-notes {
    width: 100%;
    height: 100%;
    display: grid;
    grid-template-columns: repeat(3, minmax(0, 1fr));
    grid-template-rows: repeat(3, minmax(0, 1fr));
    padding: 1px;
    pointer-events: none;
  }

  .sd-notes span {
    display: grid;
    place-items: center;
    font-family: var(--mono);
    font-size: clamp(6px, 1.7vw, 9.5px);
    font-weight: 400;
    line-height: 1;
    color: var(--ink-3);
    font-variant-numeric: tabular-nums;
  }

  /* ---------- 1–9 按键 ---------- */
  .sd-pad {
    width: min(94vw, 520px);
    display: grid;
    grid-template-columns: repeat(9, minmax(0, 1fr));
    gap: 5px;
  }

  .sd-num {
    height: clamp(40px, 7vh, 52px);
    padding: 0;
    font-family: var(--mono);
    font-size: clamp(17px, 4.4vw, 23px);
    font-weight: 700;
    color: var(--ink);
    background: #fff;
    border: 1px solid var(--line-2);
    border-radius: 6px;
    cursor: pointer;
    touch-action: manipulation;
  }

  .sd-num:active { background: var(--paper-2); transform: translateY(1px); }

  .sd-tools {
    width: min(94vw, 520px);
    display: grid;
    grid-template-columns: repeat(5, minmax(0, 1fr));
    gap: 5px;
  }

  .sd-tool {
    min-height: 34px;
    padding: 4px 4px;
    font-family: var(--sans);
    font-size: 11.5px;
    color: var(--ink-2);
    background: transparent;
    border: 1px solid var(--line);
    border-radius: 6px;
    cursor: pointer;
    white-space: nowrap;
  }

  .sd-tool:active { transform: translateY(1px); }
  .sd-tool.on {
    color: var(--paper);
    background: var(--ink);
    border-color: var(--ink);
  }

  .sd-status {
    width: min(94vw, 520px);
    min-height: 19px;
    margin: 0;
    font-size: 11.5px;
    line-height: 1.65;
    text-align: center;
    color: var(--ink-3);
    overflow-wrap: anywhere;
  }

  .sd-status.is-bad { color: var(--seal); }

  .sd-foot {
    width: min(94vw, 520px);
    margin: 0;
    font-family: var(--mono);
    font-size: 9.5px;
    line-height: 1.7;
    text-align: center;
    color: var(--ink-3);
  }

  /* ---------- 菜单 ---------- */
  #sd-overlay { background: rgba(253, 251, 246, 0.985); }
  html[data-mode="night"] #sd-overlay { background: rgba(12, 12, 16, 0.985); }

  .sd-diffs {
    display: grid;
    grid-template-columns: repeat(2, minmax(0, 1fr));
    gap: 8px;
  }

  .sd-diff {
    display: flex;
    flex-direction: column;
    gap: 3px;
    padding: 11px 12px;
    text-align: left;
    color: var(--ink-2);
    background: #fff;
    border: 1px solid var(--line);
    border-radius: 8px;
    cursor: pointer;
  }

  .sd-diff b {
    font-family: var(--serif);
    font-size: 17px;
    color: var(--ink);
    letter-spacing: 0.04em;
  }

  .sd-diff span {
    font-size: 10.5px;
    line-height: 1.5;
    color: var(--ink-3);
  }

  .sd-diff em {
    margin-top: 2px;
    font-family: var(--mono);
    font-size: 10px;
    font-style: normal;
    color: var(--seal);
  }

  .sd-diff.is-on {
    border-color: var(--seal);
    background: rgba(193, 82, 47, 0.07);
    box-shadow: inset 0 0 0 1px var(--seal);
  }

  /* ---------- 夜间 ---------- */
  html[data-mode="night"] .sd-board { background: var(--card); border-color: var(--ink-2); }
  html[data-mode="night"] .sd-cell { background: var(--card); border-color: var(--line); }
  html[data-mode="night"] .sd-cell.is-given { background: var(--paper-2); }
  html[data-mode="night"] .sd-cell.is-peer { background: rgba(217, 119, 87, 0.06); }
  html[data-mode="night"] .sd-cell.is-same { background: rgba(111, 168, 179, 0.14); }
  html[data-mode="night"] .sd-cell.is-sel { background: rgba(217, 119, 87, 0.17); }
  html[data-mode="night"] .sd-num,
  html[data-mode="night"] .sd-tool,
  html[data-mode="night"] .sd-new,
  html[data-mode="night"] .sd-diff,
  html[data-mode="night"] .icon-btn {
    background: var(--card);
    border-color: var(--line-2);
    color: var(--ink);
  }
  html[data-mode="night"] .sd-tool.on {
    background: var(--ink);
    color: #101014;
  }
  /* 演示模式退出选择 */
  .sd-demo-modal {
    position: fixed;
    inset: 0;
    z-index: 3000;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 18px;
    background: rgba(20, 18, 14, 0.58);
    backdrop-filter: blur(6px);
  }
  .sd-demo-card {
    width: min(390px, 100%);
    padding: 22px 20px 18px;
    background: var(--card, #fffdf7);
    color: var(--ink, #23211c);
    border: 1px solid var(--line, #e4dcc6);
    border-radius: 14px;
    box-shadow: 0 30px 80px -40px rgba(0, 0, 0, 0.6);
  }
  .sd-demo-card h2 {
    margin: 0 0 10px;
    font-family: var(--serif);
    font-size: 24px;
  }
  .sd-demo-card p {
    margin: 0 0 16px;
    font-size: 13px;
    line-height: 1.8;
    color: var(--ink-2, #5b574d);
  }
  .sd-demo-actions {
    display: flex;
    flex-direction: column;
    gap: 8px;
  }
  .sd-demo-actions .btn-main,
  .sd-demo-actions .btn-2nd {
    width: 100%;
  }
</style>

</head>

<body data-site="fun">

<div id="app">
  <header class="lab-hud">
    <div class="lab-title">
      <b>数独</b>
      <span>SUDOKU</span>
    </div>
    <div class="lab-stats">
      <div class="stat"><span class="k">DIFF</span><b id="sd-diff">简单</b></div>
      <div class="stat"><span class="k">TIME</span><b id="sd-timer">00:00</b></div>
      <div class="stat"><span class="k">ERR</span><b id="sd-mistakes">0</b></div>
      <div class="stat"><span class="k">HINT</span><b id="sd-hints">0</b></div>
    </div>
    <button class="icon-btn" id="btn-exit" type="button">退出</button>
  </header>

  <main class="lab-stage">
    <div class="sd-wrap">
      <div class="sd-toolbar">
        <div class="chips" id="sd-diffs" role="group" aria-label="选择数独难度"></div>
        <button class="sd-new" id="sd-new" type="button">新局</button>
      </div>

      <div class="sd-board" id="sd-board" role="grid" aria-label="数独棋盘，9 行 9 列"></div>

      <p class="sd-status" id="sd-status" role="status" aria-live="polite">选中格子，点下面的 1–9 填数。</p>

      <div class="sd-pad" id="sd-pad" role="group" aria-label="数字键盘 1 到 9"></div>

      <div class="sd-tools" id="sd-tools" role="group" aria-label="数独辅助工具">
        <button class="sd-tool" type="button" data-act="erase">擦除</button>
        <button class="sd-tool" type="button" id="sd-notes-btn" data-act="notes" aria-pressed="false">笔记：关</button>
        <button class="sd-tool" type="button" id="sd-cand-btn" data-act="cand" aria-pressed="false">候选：关</button>
        <button class="sd-tool" type="button" data-act="hint">提示</button>
        <button class="sd-tool" type="button" data-act="undo">撤销</button>
        <button class="sd-tool" type="button" id="sd-demo-btn" data-act="demo" aria-pressed="false">演示模式</button>
      </div>

      <p class="sd-foot">2500 × 难度系数 − 秒数 − 错误 × 500 · 提示/候选/演示不排行</p>
    </div>

    <div class="overlay" id="sd-overlay" hidden>
      <div class="panel" id="sd-panel"></div>
    </div>
  </main>
</div>

<noscript>
  <p style="padding:24px;font-size:14px;line-height:2">
    数独要靠 JavaScript 生成题目和计分，请打开 JavaScript 再进。
  </p>
</noscript>
