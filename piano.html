<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>钢琴辉 · 八班游乐场</title>
<meta name="description" content="钢琴辉：辉辉踩着拍子往下掉，落在判定线的一瞬点中它。四道琴键 D F J K，十首曲子，四档难度，Phi+Mil 计分满分 1000000；每首歌分别存成绩，排行取成绩×难度最高的三首。">
<meta name="theme-color" content="#f8f4e9">
<meta name="color-scheme" content="light dark">
<link rel="icon" href="assets/favicon.png?v=20261101g121" type="image/png">
<script>
window.B8_BUILD = '20261101g121';
window.B8_T = (function () {
  var m = (location.search || '').match(/[?&]t=([^&]+)/);
  return m ? '&t=' + encodeURIComponent(m[1]) : '';
})();
window.B8_TEST = !!window.B8_T;
</script>
<script src="assets/theme.js?v=20261101g121"></script>
<style>
  /* ============================================================
     钢琴辉 · 独立全屏页
     和 .fun 主站同一套纸墨配色，但不加载 styles.css：
     这个页面只关心一块键盘，公用的版心/页脚都是负担。
     ============================================================ */

  :root {
    --paper: #fdfbf6;
    --paper-2: #f7f1e3;
    --line: #e6dfd0;
    --line-2: #d3c7ac;
    --ink: #23211c;
    --ink-2: #5b574d;
    --ink-3: #918a7b;
    --seal: #c1522f;
    --gold: #c08c2c;
    --jade: #2f6f5e;
    --indigo: #3d5573;
    --serif: "Songti SC", "Noto Serif SC", "SimSun", serif;
    --sans: "PingFang SC", "Microsoft YaHei", system-ui, -apple-system, sans-serif;
    --mono: "SFMono-Regular", Consolas, "Liberation Mono", monospace;
    --keys-h: 84px;
    /* 大屏上不要把四道琴键拉成一整条横幅：整块键盘限宽居中，
       和合成小辉辉的画布一个思路，两侧留出纸色 */
    --board-max: 560px;
  }

  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

  [hidden] { display: none !important; }

  html, body {
    margin: 0;
    height: 100%;
    overflow: hidden;
    background: #efe7d5;
    color: var(--ink);
    font-family: var(--sans);
    -webkit-user-select: none;
    user-select: none;
    touch-action: none;
    overscroll-behavior: none;
  }

  #app {
    position: fixed;
    top: 0; right: 0; bottom: 0; left: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
  }

  /* 限宽的三块（记分条 / 进度条 / 舞台）——宽度一致才对得齐 */
  .hud,
  .progress,
  .stage {
    width: 100%;
    max-width: var(--board-max);
    flex: 0 0 auto;
  }

  .stage {
    flex: 1 1 auto;
    min-height: 0;
    box-shadow: 0 0 0 1px var(--line), 0 24px 60px -48px rgba(35, 33, 28, 0.55);
  }

  /* ---------- 顶部记分条 ---------- */
  .hud {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: calc(8px + env(safe-area-inset-top, 0px)) 12px 8px;
    border-bottom: 1px solid var(--line);
    background: rgba(253, 251, 246, 0.94);
  }

  .hud-stats {
    display: flex;
    align-items: stretch;
    gap: 10px;
    min-width: 0;
  }

  .stat { display: flex; flex-direction: column; gap: 1px; min-width: 42px; }

  .stat .k {
    font-family: var(--mono);
    font-size: 9px;
    letter-spacing: 0.14em;
    color: var(--ink-3);
    line-height: 1;
  }

  .stat b {
    font-family: var(--mono);
    font-size: 17px;
    font-weight: 700;
    line-height: 1.15;
    font-variant-numeric: tabular-nums;
  }

  .stat b.is-hot { color: var(--seal); }

  .hud-spacer { flex: 1 1 auto; min-width: 0; }

  .lives {
    font-family: var(--mono);
    font-size: 11px;
    letter-spacing: 0.08em;
    color: var(--seal);
    align-self: center;
    white-space: nowrap;
  }

  .hud-tools { display: flex; align-items: center; gap: 6px; }

  .icon-btn {
    width: 38px;
    height: 38px;
    display: grid;
    place-items: center;
    padding: 0;
    font-family: var(--mono);
    font-size: 13px;
    line-height: 1;
    color: var(--ink-2);
    background: #fff;
    border: 1px solid var(--line);
    border-radius: 999px;
    cursor: pointer;
  }

  .icon-btn:active { transform: translateY(1px); }
  .icon-btn[aria-pressed="false"] { color: var(--ink-3); background: var(--paper-2); }

  .icon-btn.wide {
    width: auto;
    padding: 0 12px;
    font-family: var(--sans);
    font-size: 12px;
  }

  /* ---------- 进度条 ---------- */
  .progress {
    flex: 0 0 auto;
    height: 3px;
    background: var(--paper-2);
    overflow: hidden;
  }

  .progress i {
    display: block;
    height: 100%;
    width: 0;
    background: linear-gradient(90deg, var(--gold), var(--seal));
    transition: width 0.18s linear;
  }

  /* ---------- 舞台 ---------- */
  .stage {
    position: relative;
    flex: 1 1 auto;
    display: flex;
    flex-direction: column;
    min-height: 0;
    background: linear-gradient(180deg, #fffefb 0%, var(--paper) 60%, #f8f2e4 100%);
  }

  .lanes {
    position: relative;
    flex: 1 1 auto;
    display: grid;
    grid-template-columns: repeat(4, minmax(0, 1fr));
    min-height: 0;
    overflow: hidden;
  }

  .lane {
    position: relative;
    overflow: hidden;
    border-right: 1px solid rgba(35, 33, 28, 0.05);
  }

  .lane:last-child { border-right: 0; }

  /* 判定带：越靠近底线越亮，告诉玩家"在这里点" */
  .lane::after {
    content: "";
    position: absolute;
    left: 0; right: 0; bottom: 0;
    height: 22%;
    background: linear-gradient(180deg, rgba(192, 140, 44, 0) 0%, rgba(192, 140, 44, 0.07) 62%, rgba(192, 140, 44, 0.15) 100%);
    pointer-events: none;
  }

  /* 判定线 = 车道区的底线 */
  .lanes::after {
    content: "";
    position: absolute;
    left: 0; right: 0; bottom: 0;
    height: 2px;
    background: linear-gradient(90deg, rgba(192, 140, 44, 0) 0%, var(--gold) 14%, var(--gold) 86%, rgba(192, 140, 44, 0) 100%);
    opacity: 0.8;
    pointer-events: none;
  }

  /* ---------- 琴块：整块就是一张照片 ---------- */
  .tile {
    position: absolute;
    left: 7%;
    right: 7%;
    top: 0;
    border-radius: 5px;
    border: 1px solid rgba(35, 33, 28, 0.18);
    box-shadow: 0 6px 16px -12px rgba(35, 33, 28, 0.7);
    overflow: hidden;
    background-color: #e8ddc6;
    background-size: cover;
    background-position: center 26%;
    background-repeat: no-repeat;
  }

  /* 压一层暗角，保证左下角的简谱数字在浅色照片上也看得清 */
  .tile .shade {
    position: absolute;
    top: 0; right: 0; bottom: 0; left: 0;
    background: linear-gradient(180deg,
      rgba(20, 16, 10, 0.06) 0%,
      rgba(20, 16, 10, 0.16) 45%,
      rgba(20, 16, 10, 0.58) 100%);
    pointer-events: none;
  }

  .tile .num {
    position: absolute;
    left: 4px;
    bottom: 3px;
    z-index: 1;
    min-width: 16px;
    padding: 1px 5px;
    border-radius: 4px;
    font-family: var(--mono);
    font-size: 12px;
    font-weight: 700;
    line-height: 1.35;
    text-align: center;
    color: #fff;
    background: rgba(20, 16, 10, 0.42);
    text-shadow: 0 1px 2px rgba(0, 0, 0, 0.35);
  }

  .tile.is-hit { animation: tile-hit 0.2s ease-out forwards; }

  @keyframes tile-hit {
    from { opacity: 1; transform: translateY(var(--y, 0)) scale(1); }
    to { opacity: 0; transform: translateY(var(--y, 0)) scale(1.14); }
  }

  /* 每条道一张脸，眼睛先认人再认数字 */
  .lane[data-lane="0"] .tile { background-image: url("assets/games/hui/1.jpg"); }
  .lane[data-lane="1"] .tile { background-image: url("assets/games/hui/2.jpg"); }
  .lane[data-lane="2"] .tile { background-image: url("assets/games/hui/5.jpg"); }
  .lane[data-lane="3"] .tile { background-image: url("assets/games/hui/8.jpg"); }

  /* ---------- 判定字 ---------- */
  .judge {
    position: absolute;
    left: 0; right: 0;
    bottom: var(--keys-h);
    height: 0;
    pointer-events: none;
    z-index: 5;
  }

  .judge-pop {
    position: absolute;
    bottom: 10px;
    transform: translateX(-50%);
    font-family: var(--mono);
    font-size: 12px;
    font-weight: 700;
    letter-spacing: 0.16em;
    white-space: nowrap;
    animation: judge-pop 0.52s ease-out forwards;
  }

  .judge-pop.perfect { color: var(--seal); }
  .judge-pop.good { color: var(--gold); }
  .judge-pop.miss { color: var(--ink-3); }

  @keyframes judge-pop {
    0% { opacity: 0; transform: translate(-50%, 8px) scale(0.92); }
    22% { opacity: 1; transform: translate(-50%, 0) scale(1); }
    100% { opacity: 0; transform: translate(-50%, -18px) scale(1); }
  }

  /* ---------- 倒计时 ---------- */
  .countdown {
    position: absolute;
    top: 0; right: 0; bottom: 0; left: 0;
    display: grid;
    place-items: center;
    pointer-events: none;
    z-index: 6;
  }

  .countdown span {
    font-family: var(--mono);
    font-size: 68px;
    font-weight: 700;
    color: rgba(193, 82, 47, 0.86);
    animation: cd 0.86s ease-out;
  }

  @keyframes cd {
    from { opacity: 0; transform: scale(1.5); }
    28% { opacity: 1; transform: scale(1); }
    to { opacity: 0.12; transform: scale(0.92); }
  }

  /* ---------- 键盘 ---------- */
  .keys {
    flex: 0 0 auto;
    height: var(--keys-h);
    display: grid;
    grid-template-columns: repeat(4, minmax(0, 1fr));
    gap: 5px;
    padding: 0 5px calc(5px + env(safe-area-inset-bottom, 0px));
    background: var(--paper);
    border-top: 1px solid var(--line);
  }

  .key {
    position: relative;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: flex-end;
    gap: 4px;
    padding: 0 0 12px;
    border: 1px solid var(--line);
    border-top: 0;
    border-radius: 0 0 7px 7px;
    background: linear-gradient(180deg, #fffefb 0%, #f5efe1 100%);
    box-shadow: inset 0 -3px 0 rgba(35, 33, 28, 0.06);
    cursor: pointer;
  }

  .key .k-letter {
    font-family: var(--mono);
    font-size: 13px;
    letter-spacing: 0.1em;
    color: var(--ink-3);
  }

  .key .k-bar {
    width: 26px;
    height: 3px;
    border-radius: 2px;
    background: var(--line-2);
  }

  .key[data-lane="0"] .k-bar { background: #cf5c39; }
  .key[data-lane="1"] .k-bar { background: #d3a03c; }
  .key[data-lane="2"] .k-bar { background: #3d8571; }
  .key[data-lane="3"] .k-bar { background: #4e6a8c; }

  .key.is-down {
    background: linear-gradient(180deg, #fdf1d8 0%, #f6e3b6 100%);
    box-shadow: inset 0 -1px 0 rgba(35, 33, 28, 0.08);
    transform: translateY(2px);
  }

  .key .ring {
    position: absolute;
    left: 50%;
    bottom: 34px;
    width: 12px;
    height: 12px;
    margin-left: -6px;
    border-radius: 50%;
    border: 2px solid rgba(192, 140, 44, 0.8);
    opacity: 0;
    pointer-events: none;
  }

  .key.is-down .ring { animation: ring 0.42s ease-out; }

  @keyframes ring {
    from { opacity: 0.85; transform: scale(0.6); }
    to { opacity: 0; transform: scale(3.4); }
  }

  /* ---------- 遮罩 / 面板 ---------- */
  .overlay {
    position: fixed;
    top: 0; right: 0; bottom: 0; left: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 20px;
    background: rgba(253, 251, 246, 0.95);
    z-index: 20;
    overflow: auto;
  }

  .panel {
    width: 100%;
    max-width: 440px;
    min-width: 0;
    max-height: calc(100vh - 32px);
    overflow: auto;
    text-align: center;
    padding: 4px 2px;
  }

  .panel h1 {
    margin: 0 0 6px;
    font-family: var(--serif);
    font-size: 27px;
    font-weight: 700;
    letter-spacing: 0.05em;
  }

  .panel .sub {
    margin: 0 0 20px;
    font-size: 13px;
    line-height: 1.9;
    color: var(--ink-2);
  }

  .pick { margin: 0 0 14px; text-align: left; }

  .pick-label {
    display: block;
    margin-bottom: 7px;
    font-family: var(--mono);
    font-size: 10px;
    letter-spacing: 0.16em;
    color: var(--ink-3);
  }

  .chips { display: flex; flex-wrap: wrap; gap: 6px; }

  .chip {
    min-height: 38px;
    padding: 8px 14px;
    font-family: var(--sans);
    font-size: 12.5px;
    color: var(--ink-2);
    background: #fff;
    border: 1px solid var(--line);
    border-radius: 999px;
    cursor: pointer;
  }

  .chip[aria-pressed="true"] {
    color: #fff;
    background: var(--ink);
    border-color: var(--ink);
  }

  .chip:active { transform: translateY(1px); }

  .chip small {
    font-family: var(--mono);
    font-size: 10px;
    opacity: 0.62;
    margin-left: 4px;
  }

  .btn-main {
    display: block;
    width: 100%;
    margin: 18px 0 0;
    padding: 14px;
    font-family: var(--sans);
    font-size: 15.5px;
    letter-spacing: 0.04em;
    color: #fff;
    background: var(--seal);
    border: 0;
    border-radius: 999px;
    cursor: pointer;
    box-shadow: 0 10px 24px -16px rgba(193, 82, 47, 0.9);
  }

  .btn-main:active { transform: translateY(1px); }

  .btn-2nd {
    display: block;
    width: 100%;
    margin: 8px 0 0;
    padding: 12px;
    font-family: var(--sans);
    font-size: 13.5px;
    color: var(--ink-2);
    background: transparent;
    border: 1px solid var(--line);
    border-radius: 999px;
    cursor: pointer;
  }

  .btn-2nd:active { transform: translateY(1px); }

  .tip {
    margin: 14px 0 0;
    font-size: 11.5px;
    line-height: 1.8;
    color: var(--ink-3);
  }

  .tip a { color: var(--ink-2); }
  .tip b { color: var(--ink-2); font-family: var(--mono); letter-spacing: 0.08em; }

  .score-rule {
    margin: 4px 0 10px;
    text-align: left;
    font-size: 11px;
    line-height: 1.85;
    color: var(--ink-3);
  }

  .score-rule b { color: var(--ink-2); }

  /* 曲目表：十首 × 四档定数，收在 details 里，不打开不占地方 */
  .lv-table {
    margin: 0 0 12px;
    border: 1px solid var(--line);
    border-radius: 6px;
    background: #fff;
    text-align: left;
  }

  .lv-table summary {
    padding: 9px 12px;
    font-family: var(--mono);
    font-size: 10.5px;
    letter-spacing: 0.06em;
    color: var(--ink-2);
    cursor: pointer;
  }

  .lv-table table {
    width: 100%;
    border-collapse: collapse;
    font-size: 11.5px;
  }

  .lv-table th,
  .lv-table td {
    padding: 5px 6px;
    border-top: 1px solid var(--line);
    text-align: center;
    font-variant-numeric: tabular-nums;
  }

  .lv-table th:first-child,
  .lv-table td:first-child { text-align: left; }

  .lv-table th {
    font-family: var(--mono);
    font-size: 9.5px;
    font-weight: 400;
    letter-spacing: 0.08em;
    color: var(--ink-3);
  }

  .lv-table tr.is-on td {
    color: var(--seal);
    font-weight: 700;
    background: rgba(193, 82, 47, 0.05);
  }

  .score-parts {
    margin: 10px 0 0;
    padding-top: 9px;
    border-top: 1px dashed var(--line);
    font-family: var(--mono);
    font-size: 10.5px;
    line-height: 1.7;
    color: var(--ink-3);
  }

  .score-parts b { color: var(--seal); }

  /* 我的成绩：每首歌只列最高一档，四档原始分都存着 */
  .my-scores {
    margin: 0 0 12px;
    border: 1px solid var(--line);
    border-radius: 6px;
    background: #fff;
    text-align: left;
  }

  .my-scores summary {
    padding: 9px 12px;
    font-family: var(--mono);
    font-size: 10.5px;
    letter-spacing: 0.04em;
    color: var(--ink-2);
    cursor: pointer;
  }

  .my-top {
    margin: 0;
    padding: 8px 12px 9px;
    border-top: 1px solid var(--line);
    font-size: 11.5px;
    line-height: 1.75;
    color: var(--ink-3);
  }

  .my-top b { color: var(--seal); }

  .my-table {
    width: 100%;
    border-collapse: collapse;
    font-size: 10.5px;
    font-variant-numeric: tabular-nums;
  }

  .my-table th,
  .my-table td {
    padding: 5px 6px;
    border-top: 1px solid var(--line);
    text-align: center;
  }

  .my-table th:first-child,
  .my-table td:first-child { text-align: left; }

  .my-table th {
    font-family: var(--mono);
    font-size: 9px;
    font-weight: 400;
    letter-spacing: 0.06em;
    color: var(--ink-3);
  }

  .my-table tr.is-on td {
    color: var(--seal);
    font-weight: 700;
    background: rgba(193, 82, 47, 0.05);
  }

  .my-note {
    margin: 0;
    padding: 8px 12px 10px;
    border-top: 1px dashed var(--line);
    font-size: 10px;
    line-height: 1.7;
    color: var(--ink-3);
  }

  /* ---------- 结算 ---------- */
  .result {
    margin: 4px 0 18px;
    padding: 14px 12px;
    border: 1px solid var(--line);
    border-radius: 6px;
    background: #fff;
  }

  .result .big {
    font-family: var(--mono);
    font-size: 40px;
    font-weight: 700;
    line-height: 1.05;
    color: var(--seal);
  }

  .result .big-unit {
    font-family: var(--mono);
    font-size: 11px;
    letter-spacing: 0.14em;
    color: var(--ink-3);
    margin-left: 4px;
  }

  .result .rank-line {
    margin: 6px 0 12px;
    font-size: 12.5px;
    color: var(--ink-2);
  }

  .result .rank-line b { font-family: var(--serif); font-size: 15px; }

  .result dl {
    display: grid;
    grid-template-columns: repeat(4, minmax(0, 1fr));
    gap: 6px;
    margin: 0;
    padding-top: 10px;
    border-top: 1px dashed var(--line);
  }

  .result dt {
    font-family: var(--mono);
    font-size: 9px;
    letter-spacing: 0.1em;
    color: var(--ink-3);
  }

  .result dd {
    margin: 2px 0 0;
    font-family: var(--mono);
    font-size: 15px;
    font-weight: 700;
  }

  .result dd.perfect { color: var(--seal); }
  .result dd.good { color: var(--gold); }
  .result dd.miss { color: var(--ink-3); }

  .note-line {
    margin: 12px 0 0;
    min-height: 17px;
    font-size: 12px;
    line-height: 1.7;
    color: var(--ink-3);
  }

  .note-line.is-err { color: var(--seal); }

  /* ---------- 窄屏 ---------- */
  @media (max-width: 480px) {
    .stat-sm { display: none; }
    .hud { gap: 8px; padding-left: 10px; padding-right: 10px; }
    .icon-btn { width: 34px; height: 34px; }
    .icon-btn.wide { padding: 0 9px; }
    .panel h1 { font-size: 24px; }
    .result .big { font-size: 34px; }
  }

  @media (max-height: 620px) {
    :root { --keys-h: 68px; }
    .panel .sub { margin-bottom: 12px; }
    .pick { margin-bottom: 10px; }
    .countdown span { font-size: 52px; }
  }

  /* 站内提示条：auth.js 在跨站手牌失败时会用到 .toast */
  .toast {
    position: fixed;
    left: 50%;
    bottom: 24px;
    transform: translateX(-50%);
    padding: 10px 18px;
    font-size: 13px;
    color: #fff;
    background: rgba(35, 33, 28, 0.9);
    border-radius: 999px;
    opacity: 0;
    transition: opacity 0.2s;
    z-index: 60;
    pointer-events: none;
  }

  .toast.show { opacity: 1; }
</style>

<body data-site="fun">

<div id="app">

  <header class="hud">
    <div class="hud-stats">
      <div class="stat"><span class="k">SCORE</span><b id="hud-score">0</b></div>
      <div class="stat"><span class="k">COMBO</span><b id="hud-combo">—</b></div>
