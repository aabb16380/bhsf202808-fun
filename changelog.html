<main class="page">

<noscript>
  <p style="padding:24px;font-size:14px;line-height:2">
    更新日志靠 JavaScript 读取 Markdown 渲染；也可以直接打开
    <a href="更新日志.md">更新日志.md</a>。
  </p>
</noscript>

<script>
(function () {
  'use strict';

  var logEl = document.getElementById('log');
  var verEl = document.getElementById('ver');
  var footEl = document.getElementById('foot-ver');
  var cfg = window.B8_CONFIG && window.B8_CONFIG.site;
  var version = cfg && cfg.version ? cfg.version : '';

  if (version) {
    if (footEl) footEl.textContent = version;
    if (verEl) verEl.textContent = version + ' · 更新日志';
  }

  function esc(s) {
    return String(s)
      .replace(/&/g, '&amp;')
      .replace(/</g, '&lt;')
      .replace(/>/g, '&gt;');
  }

  function inline(s) {
    var out = esc(s);
    out = out.replace(/`([^`]+)`/g, '<code>$1</code>');
    out = out.replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>');
    out = out.replace(/\[([^\]]+)\]\(([^)]+)\)/g, function (_, text, href) {
      return '<a href="' + href + '">' + text + '</a>';
    });
    // 没有 Markdown 链接时，把裸 URL 也变成可点的
    if (out.indexOf('<a ') < 0) {
      out = out.replace(/(https?:\/\/[^\s<"]+)/g, '<a href="$1">$1</a>');
    }
    return out;
  }

  function render(md) {
    var lines = String(md).replace(/\r/g, '').split('\n');
    var out = [];
    var para = [];
    var listOpen = false;
    var quoteOpen = false;
    var seenH1 = false;

    function flushPara() {
      if (para.length) {
        out.push('<p>' + inline(para.join(' ')) + '</p>');
        para = [];
      }
    }

    function closeList() {
      if (listOpen) { out.push('</ul>'); listOpen = false; }
    }

    function closeQuote() {
      if (quoteOpen) { out.push('</blockquote>'); quoteOpen = false; }
    }

    function closeBlocks() {
      flushPara();
      closeList();
      closeQuote();
    }

    for (var i = 0; i < lines.length; i++) {
      var line = lines[i];
      var t = line.trim();

      if (/^-{3,}$/.test(t)) {
        closeBlocks();
        out.push('<hr>');
        continue;
      }

      var h = /^(#{1,3})\s+(.*)$/.exec(line);
      if (h) {
        closeBlocks();
        var level = h[1].length;
        // 文件第一行是文档标题，页面上面已经有「更新日志」了，不重复画
        if (level === 1 && !seenH1) { seenH1 = true; continue; }
        out.push('<h' + level + '>' + inline(h[2]) + '</h' + level + '>');
        continue;
      }

      if (/^>\s?/.test(line)) {
        flushPara();
        closeList();
        if (!quoteOpen) { out.push('<blockquote>'); quoteOpen = true; }
        out.push('<p>' + inline(line.replace(/^>\s?/, '')) + '</p>');
        continue;
      }
      closeQuote();

      if (/^\s*[-*]\s+/.test(line)) {
        flushPara();
        if (!listOpen) { out.push('<ul>'); listOpen = true; }
        out.push('<li>' + inline(line.replace(/^\s*[-*]\s+/, '')) + '</li>');
        continue;
      }

      // 列表项的续行：缩进但没有新的 -，接在上一个 li 后面
      if (listOpen && /^\s{2,}\S/.test(line)) {
        if (out.length) {
          out[out.length - 1] = out[out.length - 1].replace(/<\/li>$/, ' ' + inline(t) + '</li>');
        }
        continue;
      }

      if (!t) {
        closeBlocks();
        continue;
      }

      closeList();
      para.push(t);
    }

    closeBlocks();
    return out.join('\n');
  }

  var url = '更新日志.md?v=' + window.B8_BUILD + (window.B8_T || '');

  fetch(url, { cache: 'no-cache' })
    .then(function (r) {
      if (!r.ok) throw new Error('HTTP ' + r.status);
      return r.text();
    })
    .then(function (md) {
      if (!logEl) return;
      logEl.innerHTML = render(md);
    })
    .catch(function () {
      if (!logEl) return;
      logEl.innerHTML =
        '<p class="failed">更新日志没读出来。可以直接打开 <a href="更新日志.md">更新日志.md</a>。</p>';
    });
})();
</script>
